<!DOCTYPE html>                                               <!-- Deklarasi: dokumen ini memakai HTML5 -->
<html lang="id">                                              <!-- Awal dokumen; lang=id = berbahasa Indonesia -->
<head>                                                        <!-- Awal bagian head (keterangan dokumen) -->
  <meta charset="UTF-8">                                      <!-- Pengodean UTF-8 agar huruf & simbol tampil benar -->
  <title>Anggaran vs Realisasi per Bidang</title>             <!-- Judul tab -->
</head>                                                       <!-- Akhir head -->
<body>                                                        <!-- Awal body -->
  <h1>Anggaran Biaya Operasional 2026</h1>                    <!-- Judul tabel -->
  <p>Realisasi s.d. Oktober 2026, dalam Rp juta</p>           <!-- Satuan ditulis sekali di atas tabel -->
  <table border="1">                                          <!-- Awal tabel bergaris -->
    <tr><th>Bidang</th><th>Anggaran</th><th>Realisasi</th><th>Sisa</th></tr>  <!-- Baris judul: 4 kolom -->
    <tr><td>Keuangan &amp; Umum</td><td>180</td><td>142</td><td>38</td></tr>  <!-- Sisa = 180 - 142 = 38 -->
    <tr><td>SDM</td><td>120</td><td>101</td><td>19</td></tr>  <!-- Sisa = 120 - 101 = 19 -->
    <tr><td>Pelayanan Pelanggan</td><td>240</td><td>226</td><td>14</td></tr>  <!-- Sisa = 240 - 226 = 14 -->
    <tr><td>Jaringan</td><td>310</td><td>248</td><td>62</td></tr>  <!-- Sisa = 310 - 248 = 62 -->
    <tr><td>Konstruksi</td><td>260</td><td>209</td><td>51</td></tr>  <!-- Sisa = 260 - 209 = 51 -->
    <tr><th>Total</th><th>1.110</th><th>926</th><th>184</th></tr>  <!-- Baris total memakai th agar tebal -->
  </table>                                                    <!-- Akhir tabel -->
</body>                                                       <!-- Akhir body -->
</html>                                                       <!-- Akhir dokumen -->
