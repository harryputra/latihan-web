<!doctype html>
<!-- Deklarasi: dokumen ini memakai HTML5 -->
<html lang="id">
  <!-- Awal dokumen; lang=id = berbahasa Indonesia -->
  <head>
    <!-- Awal bagian head (keterangan dokumen) -->
    <meta charset="UTF-8" />
    <!-- Pengodean UTF-8 agar huruf & simbol tampil benar -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Wajib: lebar halaman mengikuti layar ponsel -->
    <title>Ringkasan Anggaran</title>
    <!-- Judul tab -->
    <style>
      /* Awal CSS */
      body {
        font-family: Arial, sans-serif;
        color: #1f2a44;
        margin: 24px;
        background: #eef3f9;
      } /* Latar abu-biru agar kartu putih menonjol */
      h1 {
        color: #0b4a8b;
        font-size: 22px;
      } /* Gaya judul */
      .baris {
        display: flex;
        gap: 16px;
      } /* Wadah kartu: baris fleksibel */
      .kartu {
        flex: 1;
        background-color: white;
        border-radius: 10px;
        padding: 16px;
        width: 30%;
        border-top: 5px solid #e91598;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      } /* Kartu putih dengan bayangan */
        .label {
            font-size: 14px;
            color: #089499;
        } /* Label kartu */
        .nilai {
            font-size: 20px;
            font-weight: bold;
            color: #0b4a8b;
        } /* Nilai kartu */
    </style>
    <!-- Akhir CSS -->
  </head>
  <!-- Akhir head -->
  <body>
    <!-- Awal body -->
    <h1>Ringkasan Anggaran Biaya Operasional 2026</h1>
    <!-- Judul -->
    <div class="baris">
      <!-- Wadah kartu -->
      <div class="kartu">
        <div class="label">Anggaran</div>
        <div class="nilai">Rp 1.110 jt</div>
      </div>
      <!-- Kartu 1: anggaran -->
      <div class="kartu">
        <div class="label">Realisasi s.d. Okt</div>
        <div class="nilai">Rp 926 jt</div>
      </div>
      <!-- Kartu 2: realisasi -->
      <div class="kartu">
        <div class="label">Sisa anggaran</div>
        <div class="nilai">Rp 184 jt</div>
      </div>
      <!-- Kartu 3: sisa -->
    </div>
    <!-- Akhir wadah -->
  </body>
  <!-- Akhir body -->
</html>
<!-- Akhir dokumen -->
