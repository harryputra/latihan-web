<!DOCTYPE html>                                               <!-- Deklarasi: dokumen ini memakai HTML5 -->
<html lang="id">                                              <!-- Awal dokumen; lang=id = berbahasa Indonesia -->
<head>                                                        <!-- Awal bagian head (keterangan dokumen) -->
  <meta charset="UTF-8">                                      <!-- Pengodean UTF-8 agar huruf & simbol tampil benar -->
  <title>Pengumuman Kas Kecil</title>                         <!-- Judul yang tampil di tab peramban -->
</head>                                                       <!-- Akhir head -->
<body>                                                        <!-- Awal body: isi yang tampil di layar -->
  <h1>Pengumuman</h1>                                         <!-- Judul utama halaman (paling besar) -->
  <p>Kepada seluruh pemegang kas kecil di Kantor Unit Contoh.</p>  <!-- Paragraf pertama: kepada siapa pengumuman ditujukan -->
  <p>Laporan kas kecil bulan Oktober 2026 dikumpulkan paling lambat  <!-- Paragraf kedua dimulai -->
     <strong>Jumat, 6 November 2026</strong> ke Bidang Keuangan &amp; Umum.</p>  <!-- strong = tebal; &amp; menampilkan tanda & -->
  <p>Terima kasih atas kerja samanya.</p>                     <!-- Paragraf penutup -->
</body>                                                       <!-- Akhir body -->
</html>                                                       <!-- Akhir dokumen -->
