<!doctype html>
<!-- Deklarasi: dokumen ini memakai HTML5 -->
<html lang="id">
  <!-- Awal dokumen; lang=id = berbahasa Indonesia -->
  <head>
    <!-- Awal bagian head (keterangan dokumen) -->
    <meta charset="UTF-8" />
    <!-- Pengodean UTF-8 agar huruf & simbol tampil benar -->
    <title>Realisasi Bulanan</title>
    <!-- Judul tab -->
    <script src="js/chart.umd.min.js"></script>
    <!-- Muat Chart.js -->
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }
      .wadah {
        max-width: 760px;
      }
    </style>
    <!-- Gaya halaman -->
  </head>
  <!-- Akhir head -->
  <body>
    <!-- Awal body -->
    <h2>Realisasi Biaya Operasional per Bulan 2026 (Rp juta)</h2>
    <!-- Judul grafik -->
    <div class="wadah"><canvas id="grafik"></canvas></div>
    <!-- Kanvas grafik -->
    <script>
      // Awal JavaScript
      new Chart(document.getElementById("grafik"), {
        // Buat grafik baru
        type: "line", // Jenis grafik: garis
        data: {
          // Awal data
          labels: [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "Mei",
            "Jun",
            "Jul",
            "Agu",
            "Sep",
            "Okt",
          ], // Label 10 bulan
          datasets: [
            {
              // Satu seri data
              label: "Realisasi", // Nama seri
              data: [78, 85, 92, 88, 95, 90, 97, 99, 101, 101], // Realisasi per bulan; jumlahnya 926
              borderColor: "#e5a50f",
              backgroundColor: "#e5a50f",
              tension: 0.3, // Warna emas; tension 0.3 = garis melengkung
            },
          ], // Akhir seri
        }, // Akhir data
        options: {
          animation: false, // Pengaturan: tanpa animasi
          plugins: {
            title: { display: true, text: "Total s.d. Oktober: Rp 926 juta" },
          },
        }, // Judul di atas grafik
      }); // Akhir pengaturan
    </script>
    <!-- Akhir JavaScript -->
  </body>
  <!-- Akhir body -->
</html>
<!-- Akhir dokumen -->
