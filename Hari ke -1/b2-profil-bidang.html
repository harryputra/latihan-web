<!DOCTYPE html>                                               <!-- Deklarasi: dokumen ini memakai HTML5 -->
<html lang="id">                                              <!-- Awal dokumen; lang=id = berbahasa Indonesia -->
<head>                                                        <!-- Awal bagian head (keterangan dokumen) -->
  <meta charset="UTF-8">                                      <!-- Pengodean UTF-8 agar huruf & simbol tampil benar -->
  <title>Profil Bidang Keuangan dan Umum</title>              <!-- Judul tab -->
</head>                                                       <!-- Akhir head -->
<body>                                                        <!-- Awal body -->
  <h1>Bidang Keuangan &amp; Umum</h1>                         <!-- Judul utama (h1) -->
  <p>Kantor Unit Contoh &middot; Tahun 2026</p>               <!-- &middot; = titik kecil pemisah -->

  <h2>Tugas Utama</h2>                                        <!-- Judul bagian (h2) lebih kecil dari h1 -->
  <ul>                                                        <!-- ul = daftar berpoin (urutan tidak penting) -->
    <li>Mengelola kas kecil dan pembayaran rutin</li>         <!-- li = satu butir daftar -->
    <li>Menyusun rekap anggaran biaya operasional</li>        <!-- Butir kedua -->
    <li>Mengurus administrasi perjalanan dinas</li>           <!-- Butir ketiga -->
  </ul>                                                       <!-- Akhir daftar -->

  <h2>Kontak</h2>                                             <!-- Judul bagian Kontak -->
  <p>Ruang 104, Lantai 1 &middot; Ekstensi 1104</p>           <!-- Lokasi ruangan -->
  <p><a href="https://intranet.example/keuangan">Buka halaman intranet bidang</a></p>  <!-- a href = tautan; teks di dalamnya yang diklik (alamat contoh) -->
</body>                                                       <!-- Akhir body -->
</html>                                                       <!-- Akhir dokumen -->
